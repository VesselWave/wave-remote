name: Signed APK release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Type-check, lint, and test
        run: |
          bun run typecheck
          bun run lint
          bun test
          python3 tools/npm-lock.py --check
          ./test.sh
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Match release tag to VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing identity, build, and verify release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WAVEREMOTE_STORE_PASSWORD: ${{ secrets.WAVEREMOTE_STORE_PASSWORD }}
          WAVEREMOTE_KEY_PASSWORD: ${{ secrets.WAVEREMOTE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing release signing secrets; see docs/RELEASING.md}"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          trap 'rm -f "$RELEASE_KEYSTORE"' EXIT
          ./build.sh release
      - name: Publish APK, checksum, and signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Wave Remote $RELEASE_TAG" \
            --notes-file docs/release-notes.md \
            "dist/wave-remote-$RELEASE_TAG.apk" \
            "dist/wave-remote-$RELEASE_TAG.apk.sha256" \
            "dist/wave-remote-$RELEASE_TAG.apk.certificate.txt"
      - name: Remove signing material
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

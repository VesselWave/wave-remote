Name: Wave VPN
Summary: Unofficial WireGuard client for AirVPN
Description: |-
  Early release: anyone is welcome to use it, but it hasn't been fully
  tested on every device and system yet.

  Known issue, Samsung Android 16: DNS can leak outside the VPN during a
  crash, Wi-Fi reconnect or force-stop, even with Always-on VPN and blocking
  enabled. Full test report:
  https://github.com/VesselWave/wave-vpn-mobile/blob/d1b53f8a3c10079a83fab4d92515f3b887e9f629/docs/qa/RELEASE-SAMSUNG-STOCK.md

  Connect to AirVPN over WireGuard. Includes server selection, favorites,
  per-app split tunneling, a Quick Settings tile, and Android Always-on VPN
  support. Requires an AirVPN account. Not affiliated with AirVPN.
  No analytics, ads or third-party trackers. Account credentials and keys
  are encrypted locally with Android Keystore and excluded from backups.

  Releases are signed with the production certificate published at
  https://vpn.vwave.me and update each other in place. The old repository
  version 0.1 used a different development certificate and can't update in
  place: uninstall it in every Android user/profile first, which clears that
  profile's app data.
CurrentVersion: 0.1.5
